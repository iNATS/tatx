version: '3.8'

services:
  # ===========================================
  # Database Services
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: tatx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tatx}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tatx_secure_password_123}
      POSTGRES_DB: tatx_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tatx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tatx}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tatx-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-tatx_redis_password}
    volumes:
      - redis_data:/data
    networks:
      - tatx-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-tatx_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Backend Services
  # ===========================================
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: tatx-auth-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${DB_USER:-tatx}:${DB_PASSWORD:-tatx_secure_password_123}@postgres:5432/tatx_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-tatx_redis_password}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-change_this_to_a_secure_32_char_secret}
      - JWT_EXPIRES_IN=7d
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tatx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ride-service:
    build:
      context: .
      dockerfile: services/ride-service/Dockerfile
    container_name: tatx-ride-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3004
      - DATABASE_URL=postgresql://${DB_USER:-tatx}:${DB_PASSWORD:-tatx_secure_password_123}@postgres:5432/tatx_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-tatx_redis_password}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tatx-network

  food-service:
    build:
      context: .
      dockerfile: services/food-service/Dockerfile
    container_name: tatx-food-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=postgresql://${DB_USER:-tatx}:${DB_PASSWORD:-tatx_secure_password_123}@postgres:5432/tatx_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-tatx_redis_password}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tatx-network

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: tatx-payment-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3007
      - DATABASE_URL=postgresql://${DB_USER:-tatx}:${DB_PASSWORD:-tatx_secure_password_123}@postgres:5432/tatx_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-tatx_redis_password}@redis:6379
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - HYPERPAY_API_KEY=${HYPERPAY_API_KEY:-}
      - TABBY_API_KEY=${TABBY_API_KEY:-}
      - TAMARA_API_KEY=${TAMARA_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tatx-network

  # ===========================================
  # Frontend Applications
  # ===========================================
  customer-app:
    build:
      context: .
      dockerfile: apps/customer-app/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: tatx-customer-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3100
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      - auth-service
      - ride-service
      - food-service
    networks:
      - tatx-network

  admin-dashboard:
    build:
      context: .
      dockerfile: apps/admin-dashboard/Dockerfile
    container_name: tatx-admin-dashboard
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3103
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      - auth-service
    networks:
      - tatx-network

  # ===========================================
  # Nginx Reverse Proxy
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: tatx-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - customer-app
      - admin-dashboard
      - auth-service
      - ride-service
      - food-service
      - payment-service
    networks:
      - tatx-network

volumes:
  postgres_data:
  redis_data:

networks:
  tatx-network:
    driver: bridge
