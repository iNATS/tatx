version: '3.8'

services:
  # ===========================================
  # Database Services (Development)
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: tatx-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tatx_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tatx-dev-network

  redis:
    image: redis:7-alpine
    container_name: tatx-dev-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tatx-dev-network

  # ===========================================
  # Message Queue (Development)
  # ===========================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: tatx-dev-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: tatx
      RABBITMQ_DEFAULT_PASS: tatx123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_dev_data:/var/lib/rabbitmq
    networks:
      - tatx-dev-network

  # ===========================================
  # Mailhog (Email Testing)
  # ===========================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: tatx-dev-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - tatx-dev-network

  # ===========================================
  # pgAdmin (Database Management)
  # ===========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tatx-dev-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tatx.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - tatx-dev-network

  # ===========================================
  # MinIO (S3 Compatible Storage for Dev)
  # ===========================================
  minio:
    image: minio/minio:latest
    container_name: tatx-dev-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: tatx
      MINIO_ROOT_PASSWORD: tatx123456
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - tatx-dev-network

  # ===========================================
  # Jaeger (Distributed Tracing)
  # ===========================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: tatx-dev-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
      - "16686:16686"  # UI
    networks:
      - tatx-dev-network

volumes:
  postgres_dev_data:
  redis_dev_data:
  rabbitmq_dev_data:
  pgadmin_data:
  minio_data:

networks:
  tatx-dev-network:
    driver: bridge
