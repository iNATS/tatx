worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Upstream services
    upstream auth_service {
        server auth-service:3001;
    }

    upstream user_service {
        server user-service:3002;
    }

    upstream driver_service {
        server driver-service:3003;
    }

    upstream ride_service {
        server ride-service:3004;
    }

    upstream food_service {
        server food-service:3005;
    }

    upstream order_service {
        server order-service:3006;
    }

    upstream payment_service {
        server payment-service:3007;
    }

    upstream notification_service {
        server notification-service:3008;
    }

    upstream location_service {
        server location-service:3009;
    }

    upstream admin_service {
        server admin-service:3010;
    }

    upstream customer_app {
        server customer-app:3100;
    }

    upstream driver_app {
        server driver-app:3101;
    }

    upstream merchant_app {
        server merchant-app:3102;
    }

    upstream admin_dashboard {
        server admin-dashboard:3103;
    }

    # API Gateway
    server {
        listen 80;
        server_name api.tatx.com;

        # Auth Service
        location /api/auth {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # User Service
        location /api/users {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Driver Service
        location /api/drivers {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://driver_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Ride Service
        location /api/rides {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://ride_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Food Service
        location /api/restaurants {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://food_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Order Service
        location /api/orders {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Payment Service
        location /api/payments {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://payment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check endpoint
        location /health {
            return 200 'healthy';
            add_header Content-Type text/plain;
        }
    }

    # Customer App
    server {
        listen 80;
        server_name customer.tatx.com;

        location / {
            proxy_pass http://customer_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Driver App
    server {
        listen 80;
        server_name driver.tatx.com;

        location / {
            proxy_pass http://driver_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Merchant App
    server {
        listen 80;
        server_name merchant.tatx.com;

        location / {
            proxy_pass http://merchant_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Admin Dashboard
    server {
        listen 80;
        server_name admin.tatx.com;

        location / {
            proxy_pass http://admin_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
