version: '3.8'

# Frontend-only deployment - No database or backend required
# Uses demo mode with static data

services:
  customer-app:
    build:
      context: .
      dockerfile: apps/customer-app/Dockerfile
    container_name: tatx-customer-app
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_DEMO_MODE=true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  admin-dashboard:
    build:
      context: .
      dockerfile: apps/admin-dashboard/Dockerfile
    container_name: tatx-admin-dashboard
    restart: unless-stopped
    ports:
      - "3103:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - customer-app

# Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: tatx-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.frontend.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - customer-app
      - admin-dashboard
