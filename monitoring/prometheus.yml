# Monitoring Configuration for Tatx Platform

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3001']
    metrics_path: '/metrics'

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:3002']
    metrics_path: '/metrics'

  - job_name: 'driver-service'
    static_configs:
      - targets: ['driver-service:3003']
    metrics_path: '/metrics'

  - job_name: 'ride-service'
    static_configs:
      - targets: ['ride-service:3004']
    metrics_path: '/metrics'

  - job_name: 'food-service'
    static_configs:
      - targets: ['food-service:3005']
    metrics_path: '/metrics'

  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:3006']
    metrics_path: '/metrics'

  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:3007']
    metrics_path: '/metrics'

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:3008']
    metrics_path: '/metrics'

  - job_name: 'location-service'
    static_configs:
      - targets: ['location-service:3009']
    metrics_path: '/metrics'

  - job_name: 'admin-service'
    static_configs:
      - targets: ['admin-service:3010']
    metrics_path: '/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']
